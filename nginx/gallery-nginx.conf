# ==============================================================================
# CONFIGURACIÓN NGINX PARA ARQUITECTURA DE ALTO TRÁFICO CON X-ACCEL-REDIRECT
# Proyecto: Gallery Backend (Fastify + MySQL + Nginx)
# Ubicación física de imágenes: /data/storage/images/
# ==============================================================================

# 1. Definición del pool de conexiones hacia Node.js (Fastify)
upstream fastify_upstream {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    keepalive 64; # Mantiene conexiones HTTP abiertas para reutilización de sockets
}

server {
    listen 80;
    server_name tu-dominio.com; # Modificar con tu dominio o IP del VPS

    # Límites de subida para archivos multipart
    client_max_body_size 30M;
    client_body_buffer_size 128k;

    # Opciones de compresión gzip para respuestas JSON/texto (no imágenes ya comprimidas)
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # ==========================================================================
    # 2. UBICACIÓN PRIVADA /protected/ (ACCESIBLE EXCLUSIVAMENTE VÍA X-ACCEL)
    # ==========================================================================
    # Bloquea cualquier intento de petición directa desde el navegador (404/403).
    # Solo se activa cuando Fastify responde con la cabecera 'X-Accel-Redirect'.
    location /protected/ {
        internal;
        alias /data/storage/images/;

        # Optimizaciones I/O a nivel de kernel Linux (Zero-Copy)
        sendfile on;
        sendfile_max_chunk 512k;
        tcp_nopush on;
        tcp_nodelay on;

        # Headers de caché para imágenes inmutables
        expires max;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;

        # Log silencioso para accesos estáticos de alto volumen
        access_log off;
    }

    # ==========================================================================
    # 3. PROXY UNIFICADO PARA TODAS LAS APIS /api/ (INCLUYE /api/media/ Y /api/uploads/)
    # ==========================================================================
    # Todas las llamadas del frontend inician con /api/.
    # Para /api/media/: Fastify valida y responde con X-Accel-Redirect,
    # y Nginx intercepta automáticamente y sirve desde /protected/ sin usar Node.js.
    location /api/ {
        proxy_pass http://fastify_upstream/api/;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desactivar buffering para respuesta inmediata de headers X-Accel
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ==========================================================================
    # 5. FRONTEND ESTÁTICO (REACT SPA) O HEALTH CHECK
    # ==========================================================================
    location /health {
        proxy_pass http://fastify_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        root /var/www/gallery-frontend/dist;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
